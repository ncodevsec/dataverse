# Netlify build & routing configuration
[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # NODE_ENV=production is set for the runtime; still install devDependencies (Vite) for the build
  NPM_FLAGS = "--include=dev"
  # Non-sensitive settings whose short values (true, auto, 7, admin, ...) appear throughout the source
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,TRUST_PROXY,BCRYPT_ROUNDS,SERVE_FRONTEND,CORS_ORIGINS,MAIL_FROM,SITE_URL,DATABASE_SSL,DATABASE_SSL_REJECT_UNAUTHORIZED,JWT_EXPIRES_DAYS,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_USERNAME,BOOTSTRAP_ADMIN_NAME"

[functions]
  node_bundler = "esbuild"
  # optional native driver that `pg` tries to load; not installed, so keep it out of the bundle
  external_node_modules = ["pg-native"]
  # Free plan functions time out after 10s; the API is built to answer well within that.

# The Express app handles everything under /api
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app fallback (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
